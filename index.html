<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA pelo Meio Ambiente 🌿🤖</title>
    
    <!-- Fonte Poppins do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-decor"></div>

    <main class="container">
        <header>
            <span class="badge">💡 Ecologia & Tecnologia</span>
            <h1>Como a IA Pode Salvar o Planeta? 🌎✨</h1>
            <p>Tome decisões, explore a inteligência artificial e descubra como podemos proteger a natureza juntos!</p>
        </header>

        <!-- Card principal do Fluxograma -->
        <section class="card-flow" id="card-flow">
            <div class="step-indicator" id="step-indicator">Etapa 1 de 3</div>
            
            <div class="node-content">
                <span class="emoji-icon" id="node-emoji">🌲</span>
                <h2 id="node-title">Carregando situação...</h2>
                <p id="node-description">Aguarde um momento...</p>
            </div>

            <!-- Área de opções -->
            <div class="options-container" id="options-container">
                <!-- Botões das opções serão gerados via JS -->
            </div>

            <!-- Botão para reiniciar -->
            <button class="btn-restart hidden" id="btn-restart" onclick="iniciarFluxo()">
                🔄 Reiniciar Jornada
            </button>
        </section>

        <footer>
            <p>Desenvolvido com 💜 e IA para um futuro sustentável 🌱</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
